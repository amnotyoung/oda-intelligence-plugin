name: Update gateway contract observation

on:
  workflow_dispatch:
  schedule:
    - cron: "23 1 * * *"

# contracts:update smoke-calls the rate-limited public gateway, so this run
# shares the repository-wide gateway-smoke group with CI instead of keeping
# its own: two groups would still let the nightly sync collide with a CI run.
concurrency:
  group: oda-intelligence-gateway-smoke
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # GITHUB_TOKEN이 만든 PR은 추가 워크플로를 발동시키지 않아 CI가 붙지 않는다.
      # PAT로 밀고 열어야 pull_request 이벤트가 정상적으로 잡힌다. 시크릿이
      # 없으면 기본 토큰으로 떨어지되, 그 경우 자동 PR에는 CI가 없다.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          token: ${{ secrets.DEPENDENCY_PR_TOKEN || github.token }}

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - id: contract
        name: Inspect public ODA Intelligence gateway
        run: npm run contracts:update

      - name: Bump plugin patch version
        if: steps.contract.outputs.changed == 'true'
        run: node scripts/bump-plugin-version.mjs

      - name: Test updated public package
        if: steps.contract.outputs.changed == 'true'
        run: |
          npm test
          npm audit --omit=dev

      - id: branch
        if: steps.contract.outputs.changed == 'true'
        name: Resolve deterministic update branch
        run: |
          digest="$(sha256sum contracts/observed.lock.json | cut -c1-12)"
          echo "name=automation/gateway-contract-$digest" >> "$GITHUB_OUTPUT"

      - name: Create review pull request
        if: steps.contract.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.DEPENDENCY_PR_TOKEN || github.token }}
          BRANCH: ${{ steps.branch.outputs.name }}
        run: |
          if gh pr list --state open --head "$BRANCH" --json number --jq 'length > 0' | grep -q true; then
            echo "Gateway contract update PR already exists for $BRANCH"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add contracts/observed.lock.json
          git add package.json
          git add package-lock.json
          git add plugins/oda-intelligence/.codex-plugin/plugin.json
          git add plugins/oda-intelligence/.claude-plugin/plugin.json
          git add .claude-plugin/marketplace.json
          git commit -m "Update observed ODA Intelligence gateway contract"
          git push --set-upstream origin "$BRANCH"

          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "Review ODA Intelligence gateway contract drift" \
            --body "Compatible public gateway metadata drift was detected. Review the changed tool hashes and update the accepted contract or Skills when routing behavior changed."
