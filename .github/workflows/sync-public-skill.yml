name: Sync public skill

# 공개 스킬 본문은 이 저장소에서 쓰지 않고 상류 canonical에서 생성해 받는다.
# 상류가 푸시하면 dispatch로, 그렇지 않으면 매일 한 번 확인한다. 손으로 두 벌을
# 관리하면 상류가 바뀔 때마다 격차가 조용히 벌어진다.

on:
  repository_dispatch:
    types: [dependency-updated]
  workflow_dispatch:
  schedule:
    - cron: "41 1 * * *"

concurrency:
  group: oda-intelligence-public-skill-sync
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Checkout the canonical skill source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ vars.PUBLIC_SKILL_SOURCE_REPOSITORY }}
          ref: main
          token: ${{ secrets.DEPENDENCY_READ_TOKEN }}
          path: .skill-source

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - id: source
        name: Resolve the source commit
        run: |
          echo "sha=$(git -C .skill-source rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # 빌드 스크립트는 자기 파일 위치를 기준으로 경로를 잡으므로 어디서 실행해도
      # 된다. working-directory를 함께 주면 경로가 겹친다.
      - name: Build the public skill upstream
        run: node .skill-source/scripts/build-public-skill.mjs

      - id: sync
        name: Sync the generated public skill
        run: |
          node scripts/sync-public-skill.mjs \
            --source-dir .skill-source \
            --sha "${{ steps.source.outputs.sha }}"

      - name: Bump plugin patch version
        if: steps.sync.outputs.changed == 'true'
        run: node scripts/bump-plugin-version.mjs

      - name: Test updated public package
        if: steps.sync.outputs.changed == 'true'
        run: |
          rm -rf .skill-source
          npm test

      - id: branch
        if: steps.sync.outputs.changed == 'true'
        name: Resolve deterministic update branch
        run: |
          digest="$(sha256sum contracts/public-skill.lock.json | cut -c1-12)"
          echo "name=automation/public-skill-$digest" >> "$GITHUB_OUTPUT"

      - name: Create review pull request
        if: steps.sync.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.branch.outputs.name }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          if gh pr list --state open --head "$BRANCH" --json number --jq 'length > 0' | grep -q true; then
            echo "Public skill update PR already exists for $BRANCH"
            exit 0
          fi

          rm -rf .skill-source
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add contracts/public-skill.lock.json
          git add plugins/oda-intelligence/skills/generate-development-country-report
          git add package.json package-lock.json
          git add plugins/oda-intelligence/.codex-plugin/plugin.json
          git add plugins/oda-intelligence/.claude-plugin/plugin.json
          git add .claude-plugin/marketplace.json .agents/plugins/marketplace.json
          git commit -m "chore: sync the generated public skill"
          git push --set-upstream origin "$BRANCH"

          {
            echo "Automated public skill sync."
            echo
            echo "- Source commit: \`$SOURCE_SHA\`"
            echo "- Generated by the upstream public-skill build"
            echo "- Public package tests: passed"
          } > "$RUNNER_TEMP/body.md"
          gh pr create --base main --head "$BRANCH" \
            --title "Sync the generated public skill" \
            --body-file "$RUNNER_TEMP/body.md"
