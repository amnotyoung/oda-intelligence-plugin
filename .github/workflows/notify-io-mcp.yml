name: Notify io-mcp of consumer contract changes

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "contracts/gateway-contract.json"

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The same private-repository PAT already used for dependency PRs can
      # wake io-mcp immediately. io-mcp also polls daily, so a transient
      # dispatch failure cannot create permanent contract drift.
      - name: Dispatch the io-mcp compatibility sync
        env:
          GH_TOKEN: ${{ secrets.DEPENDENCY_PR_TOKEN }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          gh api --method POST \
            repos/amnotyoung/io-mcp/dispatches \
            -f event_type=plugin-contract-updated \
            -f "client_payload[repository]=$SOURCE_REPOSITORY" \
            -f "client_payload[commit]=$SOURCE_SHA" \
            -f "client_payload[contract_path]=contracts/gateway-contract.json"
