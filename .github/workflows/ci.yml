name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test public repository boundary and plugin contracts
        run: npm test

      - name: Require version bumps for plugin changes
        run: npm run plugin:version-check

      - name: Audit dependencies
        run: npm audit --omit=dev

  # The smoke check calls every contracted tool against the public gateway,
  # which rate-limits per minute. Two overlapping runs report a limit breach
  # as many simultaneously broken tools, so every gateway-smoking job in this
  # repository shares one concurrency group and runs alone. Offline tests
  # stay in the job above and keep their fast feedback. The same head is not
  # smoked again on the immediate main push: the gateway's minute window can
  # still contain the successful pull-request calls. Scheduled contract jobs
  # continue to provide independent post-merge live coverage.
  gateway-smoke:
    if: github.event_name == 'pull_request'
    concurrency:
      group: oda-intelligence-gateway-smoke
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify the deployed gateway and observed contract lock
        run: npm run contracts:check
