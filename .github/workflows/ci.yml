name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test public repository boundary and plugin contracts
        run: npm test

      - name: Verify the deployed gateway and observed contract lock
        run: npm run contracts:check

      - name: Require version bumps for plugin changes
        run: npm run plugin:version-check

      - name: Audit dependencies
        run: npm audit --omit=dev
