interface:
  display_name: "International ODA Data Lookup"
  short_description: "Classify projects with OECD, DAC, CRS, and IATI evidence"
  default_prompt: "Use $international-oda-data-lookup to classify a project, verify its current IATI-reported sector, or separately verify official OECD CRS submission evidence."
dependencies:
  tools:
    - type: "mcp"
      value: "oda-intelligence"
      description: "Read-only gateway for development-document and project context, official OECD DAC/CRS codes, country-level international aid evidence, and IATI discovery"
      transport: "streamable_http"
      url: "https://oda-mcp.fly.dev/oda-intelligence/v2/mcp"
policy:
  allow_implicit_invocation: true
